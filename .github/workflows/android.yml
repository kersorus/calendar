name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build time tracker APK
        run: ./gradlew assembleTimecalendarDebug

      - name: Build warehouse pay APK
        run: ./gradlew assembleWarehouseDebug

      - name: Upload time tracker APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeCalendar-debug-apk
          path: app/build/outputs/apk/timecalendar/debug/*.apk

      - name: Upload warehouse pay APK
        uses: actions/upload-artifact@v4
        with:
          name: WarehousePay-debug-apk
          path: app/build/outputs/apk/warehouse/debug/*.apk
