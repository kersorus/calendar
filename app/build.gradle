plugins {
    id "com.android.application"
}

android {
    namespace "com.kersorus.timecalendar"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.kersorus.timecalendar"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

tasks.register("verifyManifestClasses") {
    description = "Checks that manifest Activity and Service classes exist in the app source set."
    group = "verification"

    doLast {
        def namespaceName = android.namespace
        def manifestFile = file("src/main/AndroidManifest.xml")
        def manifest = new XmlSlurper(false, false).parse(manifestFile)
        def sourceRoot = file("src/main/java")
        def missingClasses = []

        def resolveClassName = { String className ->
            if (className.startsWith(".")) {
                return namespaceName + className
            }
            if (!className.contains(".")) {
                return namespaceName + "." + className
            }
            return className
        }

        def androidName = { node ->
            node.attributes().find { key, value ->
                key.toString() == "name" ||
                        key.toString() == "android:name" ||
                        key.toString().endsWith("}name")
            }?.value?.toString()
        }

        manifest.application.activity.each { activity ->
            def rawClassName = androidName(activity)
            if (rawClassName == null || rawClassName.trim().isEmpty()) {
                throw new GradleException("Manifest activity is missing android:name")
            }
            def className = resolveClassName(rawClassName)
            def javaFile = new File(sourceRoot, className.replace(".", "/") + ".java")
            if (!javaFile.isFile()) {
                missingClasses << className
            }
        }

        manifest.application.service.each { service ->
            def rawClassName = androidName(service)
            if (rawClassName == null || rawClassName.trim().isEmpty()) {
                throw new GradleException("Manifest service is missing android:name")
            }
            def className = resolveClassName(rawClassName)
            def javaFile = new File(sourceRoot, className.replace(".", "/") + ".java")
            if (!javaFile.isFile()) {
                missingClasses << className
            }
        }

        if (!missingClasses.isEmpty()) {
            throw new GradleException("Manifest references missing classes: " + missingClasses.join(", "))
        }
    }
}

tasks.named("preBuild") {
    dependsOn("verifyManifestClasses")
}
